# Private document Q&A: everything runs locally, nothing leaves the machine.
# All ports bind to 127.0.0.1 so nothing is exposed to your network.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    # NVIDIA GPU. Remove this block on CPU-only machines.
    # On a Mac, run Ollama natively instead (see README) and remove this whole service.
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant:/qdrant/storage]
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"

  app:
    build: ./app
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    depends_on: [qdrant]

volumes:
  ollama:
  qdrant:
